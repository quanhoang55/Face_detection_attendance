[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quanhoang55", email = "quanhoang1026@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Prebuilt wheel avoids compiling dlib from source on Render.
    "dlib-bin>=20.0.1.post1",
    "face-recognition>=1.3.0",
    "fastapi>=0.141.1",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    # face_recognition_models 0.3.0 still imports pkg_resources at runtime.
    "setuptools>=70,<82",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
